name: Build Native APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip'i aç
        run: |
          unzip -q aurachat-native.zip
          cp google-services.json aurachat-native/app/google-services.json
          mkdir -p ~/.android
          cp aurachat-native/aura-debug.keystore ~/.android/debug.keystore

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK derle
        working-directory: aurachat-native
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: AuraChat-native-apk
          path: aurachat-native/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1