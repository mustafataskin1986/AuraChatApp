name: Build Native APK

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip'i aç
        run: |
          unzip -q aurachat-native.zip
          cp google-services.json aurachat-native/app/google-services.json
          mkdir -p ~/.android
          cp aurachat-native/aura-debug.keystore ~/.android/debug.keystore

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK derle
        working-directory: aurachat-native
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: İmza parmak izi
        continue-on-error: true
        run: |
          AS=$(ls -d $ANDROID_HOME/build-tools/*/ | tail -1)apksigner
          $AS verify --print-certs aurachat-native/app/build/outputs/apk/debug/app-debug.apk | grep -i "digest"

      - uses: actions/upload-artifact@v4
        with:
          name: AuraChat-native-apk
          path: aurachat-native/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1

      - name: Eski APK'ları sil
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts" \
            --jq '.artifacts[] | select(.workflow_run.id != ${{ github.run_id }}) | .id' |
          while read id; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
          done